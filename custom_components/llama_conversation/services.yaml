# [prewarm1] local patch, see prewarm.py
prewarm:
  fields:
    agent_id:
      required: true
      selector:
        entity:
          filter:
            domain: conversation
            integration: llama_conversation
    satellite_id:
      required: false
      selector:
        entity:
          filter:
            domain: assist_satellite
    device_id:
      required: false
      advanced: true
      selector:
        device: {}
    language:
      required: false
      advanced: true
      selector:
        text: {}
    timeout:
      required: false
      advanced: true
      default: 60
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    keep_warm:
      required: false
      advanced: true
      default: false
      selector:
        boolean: {}
