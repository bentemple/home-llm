# Local actions for wake-word prewarm and automation-owned context.
prepare_schedule:
  description: Validate a scheduling-only tool proposal and return scheduler.add data. Never creates a schedule or executes a device action.
  fields:
    tool_calls:
      required: true
      selector:
        object: {}
    request:
      required: true
      selector:
        text: {}
    requested_at:
      required: true
      description: Original request timestamp with timezone; relative delays are anchored to this time.
      selector:
        text: {}
get_context:
  description: Render fresh home context for an automation, optionally warming the returned prefix. Runs no tools.
  fields:
    agent_id:
      required: true
      selector:
        entity:
          filter:
            domain: conversation
            integration: llama_conversation
    device_id:
      selector:
        text: {}
    satellite_id:
      selector:
        entity:
          filter:
            domain: assist_satellite
    language:
      selector:
        text: {}
    extra_system_prompt:
      description: Instructions appended after the freshly rendered home prompt.
      selector:
        text:
          multiline: true
    include_tools:
      default: true
      description: Return native tool definitions. Set false for a JSON-only planner.
      selector:
        boolean: {}
    additional_tools:
      description: Per-request OpenAI function definitions, returned and prewarmed but never executed by this action.
      selector:
        object: {}
    prewarm:
      default: false
      description: Send this exact prefix to the configured backend with generation disabled.
      selector:
        boolean: {}
    timeout:
      default: 60
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
prewarm:
  fields:
    agent_id:
      required: true
      selector:
        entity:
          filter:
            domain: conversation
            integration: llama_conversation
    satellite_id:
      required: false
      selector:
        entity:
          filter:
            domain: assist_satellite
    device_id:
      required: false
      advanced: true
      selector:
        device: {}
    language:
      required: false
      advanced: true
      selector:
        text: {}
    timeout:
      required: false
      advanced: true
      default: 60
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    keep_warm:
      required: false
      advanced: true
      default: false
      selector:
        boolean: {}
